name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build.log; then
            # Surface the actual compile errors as annotations so they show
            # on the run summary without digging through the full log.
            grep -E "Error:|error:|What went wrong|> .*" build.log | grep -v "^\s*$" | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Sinema (Android)
          body: Automated build from the latest commit on main. Debug-signed for sideloading only.
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
